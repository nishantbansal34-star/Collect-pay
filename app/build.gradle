plugins { id 'com.android.application' }

// -Pplay builds the Google Play bundle, signed with the private upload key from CI secrets.
def play = project.hasProperty('play')

android {
    namespace 'in.nrrl.collectpay'
    compileSdk 36
    defaultConfig {
        applicationId 'in.orbe.pay'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        // Fixed key committed in the repo so every direct-download APK installs as an update.
        shared {
            storeFile file('collectpay.keystore')
            storePassword 'collectpay'
            keyAlias 'collectpay'
            keyPassword 'collectpay'
        }
        // Private upload key for Google Play (only in CI secrets, never in the repo)
        if (System.getenv('PLAY_KEYSTORE')) {
            upload {
                storeFile file(System.getenv('PLAY_KEYSTORE'))
                storePassword System.getenv('PLAY_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('PLAY_KEY_PASSWORD') ?: System.getenv('PLAY_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig play ? (signingConfigs.findByName('upload') ?: null) : signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
