<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Orbe Pay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: two views on a starfield — (1) metallic QR cards, glowing amount ring, glass keypad, Request pill; (2) glass pay pass with QR, swipe between QRs, share */
:root{
  --bg:#06070A; --ink:#F2F0EB; --muted:#8A8C96; --faint:#4A4C55;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08); --edge:rgba(255,255,255,.09); --edge-hi:rgba(255,255,255,.18);
  --gold:#E3C48F; --gold-deep:#B48E57; --steel:#86A6D6; --navy:#16264A;
  --warn:#F2B48A; --scrim:rgba(0,0,0,.7);
  --f-display:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --c:#2C4A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-weight:400;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.view{position:relative;max-width:460px;margin:0 auto;min-height:100%;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px 22px;display:flex;flex-direction:column;gap:clamp(12px,2vh,18px)}
.view.enter{animation:viewIn .42s cubic-bezier(.2,.8,.2,1)}
.view.back{animation:viewBack .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
@keyframes viewBack{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;margin:-4px -2px -4px -6px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:300;letter-spacing:.01em}
.hello h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:-.01em}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);color:var(--ink);flex:none}
.round:active{background:var(--glass-2)}
.hd .ttl{font-weight:400;font-size:16px;letter-spacing:.01em}
.lbl{font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:.02em}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.sec-head button{font-size:12.5px;color:var(--muted)}

/* metallic QR cards */
.cards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:4px 18px 10px;scroll-snap-type:x mandatory}
.cards::-webkit-scrollbar{display:none}
.vcard{--k:#2C4A7A;flex:0 0 auto;width:150px;height:90px;border-radius:16px;position:relative;overflow:hidden;text-align:left;padding:12px 13px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;scroll-snap-align:start;
  background:
    linear-gradient(118deg, transparent 32%, rgba(255,255,255,.16) 46%, rgba(255,255,255,0) 60%),
    radial-gradient(130% 110% at 0% 0%, color-mix(in srgb,var(--k) 70%,#fff 18%), transparent 62%),
    linear-gradient(140deg, color-mix(in srgb,var(--k) 72%,#000), color-mix(in srgb,var(--k) 22%,#050507));
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .2s, box-shadow .25s, border-color .25s}
.vcard:active{transform:scale(.97)}
.vcard .chipdot{width:22px;height:16px;border-radius:4px;background:linear-gradient(135deg,#F3DFB4,#A9834E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.vcard .top{display:flex;align-items:center;justify-content:space-between}
.vcard .tick{width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1206;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.25s}
.vcard b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard small{display:block;font-family:var(--f-mono);font-size:10.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard[aria-pressed="true"]{border-color:rgba(227,196,143,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(227,196,143,.25),0 10px 30px -12px rgba(227,196,143,.55)}
.vcard[aria-pressed="true"] .tick{opacity:1;transform:none}
.vcard.add{background:var(--glass);border:1px dashed var(--edge-hi);color:var(--muted);align-items:center;justify-content:center;gap:4px;width:110px}
.vcard.add span{font-size:24px;font-weight:200;line-height:1;color:var(--ink)}
.warn{font-size:12.5px;color:var(--warn);display:flex;gap:8px;align-items:flex-start;margin-top:-6px}
.warn b{font-weight:500}

/* amount ring */
.ringwrap{display:grid;place-items:center;padding-top:2px}
.ring{--rs:clamp(150px,23vh,210px);width:var(--rs);height:var(--rs);border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.06), rgba(255,255,255,.01) 60%, transparent 72%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -20px 40px -20px rgba(134,166,214,.18)}
.ring::before,.ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 48%, rgba(134,166,214,.0) 48%, rgba(134,166,214,.9) 66%, #F4E2BC 80%, var(--gold) 86%, transparent 97%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
  animation:spin 9s linear infinite}
.ring::after{filter:blur(9px);opacity:.9;inset:-5px}
.ring.live::before,.ring.live::after{animation-duration:3.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.amt{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;max-width:84%}
.amtv{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,9.5vw,42px);letter-spacing:-.02em;white-space:nowrap;line-height:1}
.amtv .rs{color:var(--gold);font-weight:300;margin-right:2px}
.amtv.zero{color:var(--faint)}
.amtv .caret{display:inline-block;width:1.5px;height:.85em;background:var(--gold);margin-left:3px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notebtn{font-size:12.5px;color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.25);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notebtn.has{color:var(--ink)}

/* chips + keypad */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13.5px;font-weight:400;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.chip:active{background:var(--glass-2);border-color:var(--edge-hi)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{height:clamp(42px,6vh,56px);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--edge);font-family:var(--f-display);font-size:23px;font-weight:300;display:grid;place-items:center;transition:background .12s, box-shadow .12s, transform .08s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key:active,.key.hit{background:rgba(255,255,255,.12);box-shadow:0 0 22px -6px rgba(227,196,143,.55),inset 0 0 0 1px rgba(227,196,143,.35);transform:scale(.97)}

/* primary pill (navy → champagne) */
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;flex:none;border-radius:999px;color:#fff;font-size:16.5px;font-weight:400;letter-spacing:.01em;
  background:linear-gradient(90deg,#0E1A33 0%,#1F3460 30%,#5C6C86 58%,#C6A26B 84%,#F1DDB0 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.35),0 14px 34px -14px rgba(198,162,107,.7),-14px 6px 34px -16px rgba(110,150,230,.75);
  text-shadow:0 1px 8px rgba(0,0,0,.45);transition:opacity .2s, transform .1s, filter .2s}
.cta:active{transform:scale(.985)}
.cta:disabled{opacity:.35;filter:grayscale(.6);cursor:not-allowed}
.cta svg{flex:none}
.ghostbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14.5px;font-weight:400;color:var(--ink)}
.ghostbtn:active{background:var(--glass-2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.textbtn{align-self:center;color:var(--gold);font-size:14.5px;padding:8px 14px}

/* pay pass */
.passzone{display:flex;flex-direction:column;gap:12px}
.pass{position:relative;border-radius:28px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(165deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 55%,rgba(255,255,255,.035));
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 40px 90px -40px color-mix(in srgb,var(--c) 85%,transparent),0 0 60px -30px rgba(227,196,143,.35);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.pass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(227,196,143,.7),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(134,166,214,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pass.settle{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.pass.inR{animation:inR .4s cubic-bezier(.2,.8,.2,1)}
.pass.inL{animation:inL .4s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(65%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-65%) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{display:flex;align-items:center;gap:9px;min-width:0}
.mini i{width:30px;height:20px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(118deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 62%),linear-gradient(140deg,color-mix(in srgb,var(--c) 75%,#fff 10%),color-mix(in srgb,var(--c) 30%,#000))}
.mini span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upi-tag{font-size:11px;letter-spacing:.18em;color:var(--muted);border:1px solid var(--edge);padding:3px 8px;border-radius:999px}
.p-amt{font-family:var(--f-display);font-weight:200;font-size:clamp(44px,13vw,58px);letter-spacing:-.03em;line-height:1;overflow-wrap:anywhere}
.p-amt .rs{color:var(--gold);font-weight:200;font-size:.72em;margin-right:4px;vertical-align:.08em}
.p-to{color:var(--muted);font-size:15px;margin-top:-6px;overflow-wrap:anywhere}
.p-to b{color:var(--ink);font-weight:500}
.p-note{align-self:flex-start;font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--edge);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.tile{align-self:center;background:#FFFFFF;border-radius:22px;padding:14px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(227,196,143,.45),0 0 0 6px rgba(255,255,255,.03),0 18px 50px -18px rgba(227,196,143,.45)}
.qr{width:min(228px,60vw);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.tile.reveal .qr{animation:qrIn .7s cubic-bezier(.2,.8,.2,1)}
.tile.reveal::after{content:"";position:absolute;left:0;right:0;height:46px;top:-50px;background:linear-gradient(180deg,transparent,rgba(227,196,143,.55),transparent);animation:sweep .85s .1s ease-out forwards;pointer-events:none}
@keyframes qrIn{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes sweep{to{top:110%}}
.p-vpa{text-align:center;font-family:var(--f-mono);font-size:12.5px;color:var(--ink);opacity:.85;overflow-wrap:anywhere}
.p-apps{text-align:center;font-size:12px;color:var(--muted);margin-top:-8px}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:6px;height:6px;border-radius:999px;background:var(--faint);transition:width .25s, background .25s}
.dots button[aria-current="true"]{width:20px;background:linear-gradient(90deg,var(--steel),var(--gold))}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 0}

/* full screen */
.present{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  background:radial-gradient(60% 40% at 50% 38%, color-mix(in srgb,var(--c) 45%,transparent), transparent 75%),radial-gradient(50% 30% at 80% 0%, rgba(227,196,143,.16), transparent 70%),#030305;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:viewIn .35s ease-out}
.present .ey{font-size:12px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
.present .p-amt{font-size:clamp(48px,15vw,68px)}
.present .qr{width:min(290px,72vw)}
.present .who{font-size:17px;font-weight:400}
.present .p-vpa{margin-top:2px}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .18s ease-out;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:460px;border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto;
  background:linear-gradient(180deg,#14151B,#0B0C10);border-top:1px solid var(--edge-hi);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--faint);align-self:center}
.sheet h2{margin:0;font-weight:400;font-size:21px;letter-spacing:-.01em}
.f{display:flex;flex-direction:column;gap:7px}
.f input{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:13px 14px;width:100%}
.f input:focus{border-color:rgba(227,196,143,.6);outline:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.15)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px #0B0C10,0 0 0 3.5px var(--gold)}
.tip{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13.5px;min-height:1.2em;margin:0}
.row3{display:flex;gap:10px}.row3>*{flex:1}
.solid{height:50px;border-radius:999px;background:var(--ink);color:#0B0C10;font-weight:500}
.danger{color:var(--warn)}
.preview img{width:100%;border-radius:18px;display:block}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:rgba(30,31,38,.92);border:1px solid var(--edge-hi);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;z-index:50;white-space:nowrap;backdrop-filter:blur(10px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const PALETTE=[["Sapphire","#2C4A7A"],["Champagne","#B08A52"],["Ruby","#8A2338"],["Amethyst","#55348C"],["Emerald","#1E6450"],["Rose gold","#B0705E"],["Steel","#4E6E92"],["Graphite","#3B3E48"]];
const KEY="collectpay.v1";
const IS_APP=!!window.Android;
let state={accounts:[
  {id:"a1",label:"Shop counter",vpa:"example@upi",name:"Your Shop Name",color:"#2C4A7A",example:true},
  {id:"a2",label:"Wholesale",vpa:"example2@upi",name:"Your Business Name",color:"#B08A52",example:true}
],active:"a1"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.accounts))state=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const active=()=>state.accounts.find(a=>a.id===state.active)||state.accounts[0];
const isSample=a=>a&&(a.example||/^example/i.test(a.vpa));
let amtStr="",note="",current=null;

/* ---------- starfield ---------- */
function stars(){
  const c=$("stars"),d=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  c.width=w*d;c.height=h*d;const x=c.getContext("2d");x.scale(d,d);
  let g=x.createRadialGradient(w*.85,-40,0,w*.85,-40,w*.9);g.addColorStop(0,"rgba(227,196,143,.13)");g.addColorStop(1,"rgba(227,196,143,0)");x.fillStyle=g;x.fillRect(0,0,w,h);
  g=x.createRadialGradient(0,h*.75,0,0,h*.75,w*.9);g.addColorStop(0,"rgba(96,130,200,.12)");g.addColorStop(1,"rgba(96,130,200,0)");x.fillStyle=g;x.fillRect(0,0,w,h);
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<Math.round(w*h/2600);i++){const a=r()*.55+.08,z=r()<.08?1.3:.6+r()*.4;x.fillStyle=r()<.2?`rgba(227,206,170,${a})`:`rgba(220,228,255,${a})`;x.beginPath();x.arc(r()*w,r()*h,z,0,7);x.fill()}
}
stars();addEventListener("resize",()=>{clearTimeout(stars.t);stars.t=setTimeout(stars,150)});
(function(){const h=new Date().getHours();$("greet").textContent=h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":"Good evening"})();

/* ---------- money ---------- */
function parseAmt(v){v=String(v).replace(/[,\s₹]/g,"");if(!/^\d+(\.\d{0,2})?$/.test(v))return null;const n=parseFloat(v);return n>0&&n<=100000?n:null}
const fmtNum=n=>n.toLocaleString("en-IN",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const fmt=n=>"₹"+fmtNum(n);
function upiLink(a,n,nt){
  const p=new URLSearchParams();p.set("pa",a.vpa.trim());p.set("pn",(a.name||a.label).trim());
  p.set("am",n.toFixed(2));p.set("cu","INR");if(nt)p.set("tn",nt);
  return "upi://pay?"+p.toString().replace(/\+/g,"%20");
}
function makeQR(text,px){
  if(typeof QRCode==="undefined")throw new Error("lib");
  const holder=document.createElement("div");
  new QRCode(holder,{text,width:px,height:px,colorDark:"#000000",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M});
  const src=holder.querySelector("canvas");if(!src)throw new Error("canvas");
  const c=document.createElement("canvas");c.width=px;c.height=px;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(src,0,0);return c;
}

/* ---------- request view ---------- */
function renderCards(){
  $("cards").innerHTML=state.accounts.map(a=>`<button type="button" class="vcard" style="--k:${esc(a.color)}" data-id="${esc(a.id)}" aria-pressed="${a.id===state.active}">
    <span class="top"><span class="chipdot"></span><span class="tick"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.2 4.2 7.4 8 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    <span><b>${esc(a.label)}</b><small>${esc(a.vpa)}</small></span></button>`).join("")+
    `<button type="button" class="vcard add" id="addAcct"><span>+</span>Add QR</button>`;
  const a=active(),w=$("warn");
  if(a)document.documentElement.style.setProperty("--c",a.color);
  w.hidden=!isSample(a);
  if(isSample(a))w.innerHTML=`<span>●</span><span><b>Sample UPI ID.</b> Tap the pencil and enter your real UPI ID before collecting.</span>`;
  const el=$("cards").querySelector('[aria-pressed="true"]');
  if(el){const s=$("cards"),l=el.offsetLeft-s.offsetLeft-18;if(l<s.scrollLeft||l+el.offsetWidth+36>s.scrollLeft+s.clientWidth)s.scrollTo({left:Math.max(0,l),behavior:"smooth"})}
}
function renderAmt(){
  const n=parseAmt(amtStr),v=$("amtv");
  let shown=amtStr?(()=>{const [i,d]=amtStr.split(".");return Number(i||0).toLocaleString("en-IN")+(d!==undefined?"."+d:"")})():"0";
  v.classList.toggle("zero",!amtStr);
  v.innerHTML=`<span class="rs">₹</span>${shown}${amtStr?'<span class="caret"></span>':""}`;
  $("ring").classList.toggle("live",!!n);
  const b=$("reqBtn");b.disabled=!n||!active();
  b.innerHTML=n?`Request ${fmt(n)} <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3.5 9h11M10 4.5 14.5 9 10 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:(amtStr&&!n?"Up to ₹1,00,000":"Enter amount");
  const nb=$("noteBtn");nb.textContent=note?note:"+ Add note";nb.classList.toggle("has",!!note);
}
function press(k){
  if(k==="del"){amtStr=amtStr.slice(0,-1)}
  else if(k==="clear"){amtStr=""}
  else if(k==="."){if(!amtStr.includes("."))amtStr=(amtStr||"0")+"."}
  else{
    const [i,d]=amtStr.split(".");
    if(d!==undefined){if(d.length>=2)return}
    else if(amtStr==="0"){amtStr=""}
    else if((i||"").length>=6)return;
    const next=amtStr+k;if(parseFloat(next)>100000)return buzz();
    amtStr=next;
  }
  renderAmt();
}
function buzz(){const r=$("ring");r.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:220})}
$("chips").innerHTML=[100,200,500,1000,2000,5000].map(v=>`<button type="button" class="chip" data-v="${v}">${fmt(v)}</button>`).join("");
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;amtStr=b.dataset.v;renderAmt()});
let holdT=null;
$("pad").addEventListener("pointerdown",e=>{const b=e.target.closest(".key");if(!b)return;
  if(b.dataset.k==="del"){holdT=setTimeout(()=>{holdT="fired";press("clear");b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),150)},520)}});
$("pad").addEventListener("pointerup",()=>{if(holdT&&holdT!=="fired")clearTimeout(holdT)});
$("pad").addEventListener("click",e=>{const b=e.target.closest(".key");if(!b)return;
  if(b.dataset.k==="del"&&holdT==="fired"){holdT=null;return}holdT=null;
  press(b.dataset.k);try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}});
$("cards").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="addAcct")return editSheet();state.active=b.dataset.id;save();renderCards();renderAmt()});
$("editBtn").onclick=()=>editSheet(active()||null);
$("noteBtn").onclick=noteSheet;
$("reqBtn").onclick=openQR;

/* ---------- views ---------- */
function show(id,cls){["vReq","vQR"].forEach(v=>{const el=$(v);el.hidden=v!==id;el.classList.remove("enter","back")});const el=$(id);void el.offsetWidth;el.classList.add(cls);scrollTo(0,0)}
function openQR(){if(!parseAmt(amtStr)||!active())return;show("vQR","enter");renderPass(0,true)}
function backToPad(){show("vReq","back");renderCards();renderAmt()}
$("backBtn").onclick=backToPad;
$("newBtn").onclick=()=>{amtStr="";note="";backToPad()};

function renderPass(dir,reveal){
  const a=active(),z=$("passzone"),n=parseAmt(amtStr);if(!a||!n)return;
  document.documentElement.style.setProperty("--c",a.color);
  current={a,n,note,link:upiLink(a,n,note)};
  const [ip,dp]=fmtNum(n).split(".");
  z.innerHTML=`<article class="pass${dir>0?" inR":dir<0?" inL":""}">
    <div class="p-row"><span class="mini"><i></i><span>${esc(a.label)}</span></span><span class="upi-tag">UPI</span></div>
    <div class="p-amt"><span class="rs">₹</span>${ip}${dp?`<span style="font-size:.55em">.${dp}</span>`:""}</div>
    <div class="p-to">to <b>${esc(a.name)}</b></div>
    ${note?`<div class="p-note">${esc(note)}</div>`:""}
    <div class="tile${reveal||dir?" reveal":""}"><div class="qr" id="qr"></div></div>
    <div class="p-vpa">${esc(a.vpa)}</div>
    <div class="p-apps">Scan with GPay · PhonePe · Paytm · BHIM</div>
  </article>${isSample(a)?`<div class="warn" style="margin:0;justify-content:center"><span>●</span><span><b>Sample UPI ID.</b> Don't collect money with it.</span></div>`:""}
  ${state.accounts.length>1?`<div class="dots">${state.accounts.map(x=>`<button type="button" data-id="${esc(x.id)}" aria-label="${esc(x.label)}" aria-current="${x.id===a.id}"></button>`).join("")}</div><p class="hint">Swipe the card to switch QR</p>`:""}`;
  try{$("qr").appendChild(makeQR(current.link,480))}
  catch(e){$("qr").innerHTML=`<div style="color:#555;font-size:13px;padding:20px;text-align:center">${e.message==="lib"?"QR tool didn't load. Check your internet and reopen.":"Couldn't make this QR. Try a shorter note."}</div>`;current=null}
  $("shareBtn").disabled=!current;
  attachSwipe(z.querySelector(".pass"));
}
$("passzone").addEventListener("click",e=>{const b=e.target.closest(".dots button");if(b)goTo(b.dataset.id)});
function goTo(id,dir){if(id===state.active)return;const ids=state.accounts.map(a=>a.id);if(!dir)dir=ids.indexOf(id)>ids.indexOf(state.active)?1:-1;state.active=id;save();renderPass(dir)}
function step(dir){const ids=state.accounts.map(a=>a.id),n=ids.length;if(n<2)return;goTo(ids[(ids.indexOf(state.active)+dir+n)%n],dir)}
function attachSwipe(el){
  let x0=0,y0=0,dx=0,id=null,horiz=null;const multi=state.accounts.length>1;
  el.addEventListener("pointerdown",e=>{if(e.button)return;id=e.pointerId;x0=e.clientX;y0=e.clientY;dx=0;horiz=null;el.classList.remove("settle","inR","inL")});
  el.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8)){horiz=Math.abs(mx)>Math.abs(my);if(horiz)try{el.setPointerCapture(id)}catch(_){}}
    if(!horiz)return;dx=multi?mx:mx*.25;el.style.transform=`translateX(${dx}px) rotate(${dx*.03}deg)`;el.style.opacity=String(1-Math.min(.5,Math.abs(dx)/600))});
  const end=e=>{if(e.pointerId!==id)return;id=null;if(!horiz)return;
    const go=multi&&Math.abs(dx)>Math.min(90,el.offsetWidth*.22);el.classList.add("settle");
    if(go){const dir=dx<0?1:-1;el.style.transform=`translateX(${dx<0?-120:120}%) rotate(${dx<0?-6:6}deg)`;el.style.opacity="0";setTimeout(()=>step(dir),170)}
    else{el.style.transform="";el.style.opacity=""}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}

/* ---------- full screen ---------- */
function present(){
  if(!current)return;const {a,n,link}=current;
  const d=document.createElement("div");d.className="present";d.setAttribute("role","dialog");d.setAttribute("aria-label","Payment QR");
  d.innerHTML=`<div class="ey">Scan to pay</div><div class="p-amt"><span class="rs">₹</span>${fmtNum(n)}</div>
    <div class="tile reveal"><div class="qr" id="qr2"></div></div>
    <div><div class="who">${esc(a.name)}</div><div class="p-vpa">${esc(a.vpa)}</div></div>
    ${note?`<div class="p-note" style="align-self:center">${esc(note)}</div>`:""}
    <button class="ghostbtn" type="button" style="padding:0 34px;margin-top:6px">Done</button>`;
  document.body.appendChild(d);d.querySelector("#qr2").appendChild(makeQR(link,600));
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>d._lock=l).catch(()=>{})}catch(e){}
  try{IS_APP&&Android.keepAwake(true)}catch(e){}
  d._close=()=>{try{d._lock&&d._lock.release()}catch(e){}try{IS_APP&&Android.keepAwake(false)}catch(e){}d.remove()};
  const done=d.querySelector("button");done.onclick=d._close;done.focus();
}
$("fullBtn").onclick=present;

/* ---------- share image ---------- */
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function fit(x,s,max){if(x.measureText(s).width<=max)return s;while(s.length>1&&x.measureText(s+"…").width>max)s=s.slice(0,-1);return s+"…"}
async function buildCard(){
  const {a,n,note:nt,link}=current;
  try{await Promise.race([Promise.all([document.fonts.load('200 150px "Outfit"'),document.fonts.load('400 40px "Outfit"'),document.fonts.load('500 34px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,1200))])}catch(e){}
  const W=1080,H=1600,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const F='"Outfit",system-ui,sans-serif',M='"JetBrains Mono",ui-monospace,monospace';
  const ls=v=>{if("letterSpacing" in x)x.letterSpacing=v};
  x.fillStyle="#05060A";x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(W*.9,0,0,W*.9,0,900);g.addColorStop(0,"rgba(227,196,143,.22)");g.addColorStop(1,"rgba(227,196,143,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(0,H*.8,0,0,H*.8,900);g.addColorStop(0,a.color+"66");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
  let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<260;i++){x.fillStyle=`rgba(225,230,255,${r()*.5+.1})`;x.beginPath();x.arc(r()*W,r()*H,r()<.1?2.2:1+r(),0,7);x.fill()}
  const cx=70,cy=80,cw=940,ch=1440;
  rr(x,cx,cy,cw,ch,64);g=x.createLinearGradient(cx,cy,cx+cw,cy+ch);g.addColorStop(0,"rgba(255,255,255,.10)");g.addColorStop(.55,"rgba(255,255,255,.03)");g.addColorStop(1,"rgba(255,255,255,.05)");x.fillStyle=g;x.fill();
  g=x.createLinearGradient(cx,cy,cx+cw,cy+ch);g.addColorStop(0,"rgba(227,196,143,.85)");g.addColorStop(.3,"rgba(255,255,255,.08)");g.addColorStop(.7,"rgba(255,255,255,.08)");g.addColorStop(1,"rgba(134,166,214,.75)");x.strokeStyle=g;x.lineWidth=3;x.stroke();
  // header row
  x.textBaseline="alphabetic";x.textAlign="left";x.fillStyle="#8A8C96";x.font=`400 30px ${F}`;ls("6px");x.fillText("PAYMENT REQUEST",cx+70,cy+110);ls("0px");
  x.textAlign="right";x.font=`400 30px ${F}`;x.fillText(fit(x,a.label,360),cx+cw-70,cy+110);
  // amount
  x.textAlign="left";const ip=fmtNum(n);let fs=170;x.font=`200 ${fs}px ${F}`;
  const rsW=()=>{x.font=`200 ${fs*.7}px ${F}`;const w=x.measureText("₹").width;x.font=`200 ${fs}px ${F}`;return w};
  while(rsW()+18+x.measureText(ip).width>cw-140&&fs>80)fs-=8;
  const rw=rsW();x.fillStyle="#E3C48F";x.font=`200 ${fs*.7}px ${F}`;x.fillText("₹",cx+66,cy+290);
  x.fillStyle="#F2F0EB";x.font=`200 ${fs}px ${F}`;ls(`-${Math.round(fs*.03)}px`);x.fillText(ip,cx+66+rw+18,cy+290);ls("0px");
  x.font=`300 42px ${F}`;x.fillStyle="#8A8C96";x.fillText("to ",cx+70,cy+370);const pw=x.measureText("to ").width;
  x.fillStyle="#F2F0EB";x.font=`500 42px ${F}`;x.fillText(fit(x,a.name,cw-140-pw),cx+70+pw,cy+370);
  let qy=cy+430;
  if(nt){x.font=`400 30px ${F}`;const t=fit(x,nt,cw-200),w=x.measureText(t).width+50;rr(x,cx+70,cy+405,w,58,29);x.fillStyle="rgba(255,255,255,.07)";x.fill();x.strokeStyle="rgba(255,255,255,.12)";x.lineWidth=2;x.stroke();x.fillStyle="#F2F0EB";x.fillText(t,cx+95,cy+445);qy=cy+500}
  // QR tile
  const q=580,tp=36,tw=q+tp*2,tx=(W-tw)/2,ty=qy+30;
  x.save();x.shadowColor="rgba(227,196,143,.35)";x.shadowBlur=70;rr(x,tx,ty,tw,tw,48);x.fillStyle="#FFFFFF";x.fill();x.restore();
  rr(x,tx,ty,tw,tw,48);x.strokeStyle="rgba(227,196,143,.7)";x.lineWidth=3;x.stroke();
  x.imageSmoothingEnabled=false;x.drawImage(makeQR(link,q),tx+tp,ty+tp);
  const by=ty+tw;
  x.textAlign="center";x.fillStyle="#F2F0EB";x.font=`500 32px ${M}`;x.fillText(fit(x,a.vpa,cw-140),W/2,by+80);
  x.fillStyle="#8A8C96";x.font=`300 30px ${F}`;x.fillText("Scan with GPay · PhonePe · Paytm · BHIM",W/2,by+134);
  x.fillStyle="#5E606B";x.font=`300 26px ${F}`;x.fillText("Amount is filled in. Just approve with your UPI PIN.",W/2,by+180);
  x.fillStyle="#6E6A60";x.font=`400 24px ${F}`;ls("6px");x.fillText("ORBE PAY",W/2,H-34);ls("0px");
  return cv;
}
function shareText(c){return `Payment request: ${fmt(c.n)} to ${c.a.name}${c.note?` for ${c.note}`:""}.\nScan the QR with any UPI app, or pay to UPI ID: ${c.a.vpa}`}
async function shareQR(){
  if(!current)return;const btn=$("shareBtn");btn.disabled=true;
  try{
    const cv=await buildCard(),url=cv.toDataURL("image/png"),text=shareText(current);
    if(IS_APP&&Android.shareImage){Android.shareImage(url.split(",")[1],text);return}
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));const file=blob&&new File([blob],"payment-qr.png",{type:"image/png"});
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text});return}catch(e){if(e&&e.name==="AbortError")return}}
    const bg=sheetShell(`<h2>Share this QR</h2><div class="preview"><img src="${url}" alt="Payment QR card"></div>

      <div class="row3"><button type="button" class="ghostbtn" data-close>Close</button><button type="button" class="solid" id="pvCopy">Copy message</button></div>`);
    bg.querySelector("#pvCopy").onclick=()=>copyText(text,"Message copied");
  }catch(e){toast("Couldn't make the image. Try again.")}
  finally{btn.disabled=!current}
}
$("shareBtn").onclick=shareQR;

/* ---------- sheets ---------- */
function sheetShell(html){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest("[data-close]"))bg.remove()});
  bg.addEventListener("keydown",e=>{if(e.key==="Escape")bg.remove()});
  return bg;
}
function noteSheet(){
  const bg=sheetShell(`<form style="display:flex;flex-direction:column;gap:16px" novalidate><h2>Note for payer</h2>
    <div class="f"><label class="lbl" for="n_in">Shown in their UPI app</label><input id="n_in" maxlength="40" placeholder="e.g. Order #214, balloons" value="${esc(note)}"></div>
    <div class="row3"><button type="button" class="ghostbtn" id="n_clear">Remove</button><button type="submit" class="solid">Save note</button></div></form>`);
  const f=bg.querySelector("form");
  f.onsubmit=e=>{e.preventDefault();note=f.n_in.value.trim();bg.remove();renderAmt()};
  bg.querySelector("#n_clear").onclick=()=>{note="";bg.remove();renderAmt()};
  setTimeout(()=>f.n_in.focus(),60);
}
function editSheet(acct){
  const isNew=!acct;acct=acct||{id:"a"+Date.now(),label:"",vpa:"",name:"",color:PALETTE[state.accounts.length%PALETTE.length][1]};
  let color=acct.color;const sample=isSample(acct);
  const bg=sheetShell(`<form style="display:flex;flex-direction:column;gap:16px" novalidate>
    <h2>${isNew?"Add a QR":"Edit QR"}</h2>
    <div class="f"><label class="lbl" for="f_label">Name this QR</label><input id="f_label" placeholder="Shop counter, Wholesale, Personal…" value="${esc(acct.label)}"></div>
    <div class="f"><label class="lbl" for="f_vpa">UPI ID</label><input id="f_vpa" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="yourname@okhdfcbank" value="${sample?"":esc(acct.vpa)}"></div>
    <div class="f"><label class="lbl" for="f_name">Name customers see</label><input id="f_name" placeholder="Business or account holder name" value="${sample?"":esc(acct.name)}"></div>
    <div class="f"><span class="lbl">Card finish</span><div class="swatches">${PALETTE.map(([nm,c])=>`<button type="button" data-c="${c}" aria-label="${nm}" aria-pressed="${c.toLowerCase()===String(color).toLowerCase()}" style="background:linear-gradient(118deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 62%),linear-gradient(140deg,${c},color-mix(in srgb,${c} 35%,#000))"></button>`).join("")}</div></div>
    <p class="tip">Find your UPI ID in your bank or UPI app under Profile. It looks like name@bank.</p>
    <p class="err" id="f_err"></p>
    <div class="row3">${isNew?"":`<button type="button" class="ghostbtn danger" id="f_del">Delete</button>`}<button type="button" class="ghostbtn" data-close>Cancel</button><button type="submit" class="solid">Save</button></div>
  </form>`);
  const f=bg.querySelector("form"),sw=[...bg.querySelectorAll(".swatches button")];
  sw.forEach(b=>b.onclick=()=>{color=b.dataset.c;sw.forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const del=bg.querySelector("#f_del");let armed=false;
  if(del)del.onclick=()=>{if(!armed){armed=true;del.textContent="Tap to confirm";return}
    state.accounts=state.accounts.filter(a=>a.id!==acct.id);if(state.active===acct.id)state.active=state.accounts[0]&&state.accounts[0].id;
    save();bg.remove();refresh();toast("QR deleted")};
  f.onsubmit=e=>{e.preventDefault();
    const label=f.f_label.value.trim(),vpa=f.f_vpa.value.trim().toLowerCase(),name=f.f_name.value.trim(),err=bg.querySelector("#f_err");
    if(!label)return err.textContent="Give this QR a name, like Shop counter.";
    if(!/^[a-z0-9.\-_]{2,256}@[a-z][a-z0-9.\-]{1,64}$/.test(vpa))return err.textContent="That UPI ID doesn't look right. It should look like name@bank.";
    if(!name)return err.textContent="Add the name customers will see when they pay.";
    const rec={id:acct.id,label,vpa,name,color};const i=state.accounts.findIndex(a=>a.id===acct.id);
    if(i>=0)state.accounts[i]=rec;else state.accounts.push(rec);state.active=rec.id;save();bg.remove();refresh();toast("QR saved")};
  setTimeout(()=>f.f_label.focus(),60);
}
function refresh(){renderCards();renderAmt();if(!$("vQR").hidden)renderPass()}

/* ---------- copy / toast ---------- */
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1900)}
function copyText(text,msg){
  if(IS_APP&&Android.copy){try{Android.copy(text);return}catch(e){}}
  const fb=()=>{const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}t.remove();toast(ok?msg:"Couldn't copy. Select the text and copy it.")};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(fb)}catch(e){fb()}
}
$("copyBtn").onclick=()=>{const a=active();if(a)copyText(a.vpa,"UPI ID copied")};

/* ---------- keyboard + back ---------- */
window.__back=function(){
  const p=document.querySelector(".present");if(p){p._close();return 1}
  const s=document.querySelector(".sheet-bg");if(s){s.remove();return 1}
  if(!$("vQR").hidden){backToPad();return 1}
  return 0;
};
document.addEventListener("keydown",e=>{
  if(document.querySelector(".sheet-bg")||/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName))return;
  if(e.key==="Escape"){window.__back();return}
  if(!$("vQR").hidden){if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);return}
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="."||e.key===",")press(".");else if(e.key==="Backspace")press("del");else if(e.key==="Enter")openQR();
});

renderCards();renderAmt();
</script>
</body>
</html>
