<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Orbe Pay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an AMOLED-black abstract light scene painted on the GPU; every surface (keys, cards, buttons, sheets) is refracting glass drawn
   underneath ordinary page elements. One deliberate look (AMOLED black), so colours are explicit rather than themed. */
:root{
  --ink:#FFFFFF;--soft:rgba(255,255,255,.74);--faint:rgba(255,255,255,.52);--line:rgba(255,255,255,.2);
  --warm:#FFB59E;--warn:#FFC7A8;--bg:#000000;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:400;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.view,.layer{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.inner{max-width:460px;min-height:100%;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px),var(--sal,0px));padding-right:max(18px,env(safe-area-inset-right,0px),var(--sar,0px));padding-block:calc(10px + max(env(safe-area-inset-top,0px),var(--sat,0px))) calc(18px + max(env(safe-area-inset-bottom,0px),var(--sab,0px)));display:flex;flex-direction:column;gap:clamp(10px,1.7vh,16px)}
.modal .view{visibility:hidden}
.view.enter{animation:vin .45s cubic-bezier(.2,.8,.2,1)}
.view.back{animation:vback .4s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(24px) scale(.98)}}
@keyframes vback{from{opacity:0;transform:translateY(-14px)}}
.t-shadow,.hd h1,.amtv,.p-amt,.big{text-shadow:0 1px 18px rgba(10,14,30,.35)}

/* fallback glass when WebGL is unavailable */
.nogl [data-glass]{background:rgba(255,255,255,.1);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12)}
.nogl body{background:radial-gradient(60% 40% at 30% 30%,rgba(140,90,255,.35),transparent 70%),radial-gradient(50% 35% at 75% 70%,rgba(20,220,190,.25),transparent 70%),#000}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;margin:-2px -2px -2px -4px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.hd small{display:block;color:var(--soft);font-size:13px;font-weight:300}
.hd h1{margin:0;font-weight:400;font-size:22px;letter-spacing:-.01em}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ttl{font-size:16px;font-weight:400}
.lbl{font-size:13px;color:var(--soft)}

/* account cards */
.cards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:6px 18px 12px;scroll-snap-type:x mandatory}
.cards::-webkit-scrollbar{display:none}
.acct{flex:none;width:152px;height:92px;border-radius:24px;padding:13px 15px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start}
.acct .top{display:flex;justify-content:space-between;align-items:center}
.acct .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.acct .tick{width:20px;height:20px;border-radius:50%;background:#fff;color:#1E2230;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:.25s}
.acct[aria-pressed="true"] .tick{opacity:1;transform:none}
.acct b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct.add{width:104px;align-items:center;justify-content:center;gap:2px;color:var(--soft);font-size:13px}
.acct.add span{font-size:26px;font-weight:300;color:#fff;line-height:1}
.warn{font-size:12.5px;color:var(--warn);display:flex;gap:8px;margin-top:-6px}
.warn b{font-weight:500}

/* amount bubble */
.amtwrap{display:grid;place-items:center}
.ball{width:clamp(164px,24vh,204px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.amtv{font-weight:300;font-size:clamp(32px,9.5vw,42px);letter-spacing:-.02em;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.amtv .rs{color:var(--warm);margin-right:2px}
.amtv.zero{color:var(--faint)}
.caret{display:inline-block;width:1.5px;height:.82em;background:#fff;margin-left:3px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notebtn{font-size:12.5px;color:var(--soft);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 6px}
.notebtn.has{color:#fff}

/* chips + keypad */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:4px 18px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;font-size:14px;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(44px,6.4vh,56px);border-radius:18px;font-size:24px;font-weight:300;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cta{height:58px;border-radius:999px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:500;flex:none}
.cta:disabled{color:var(--faint);cursor:not-allowed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{height:50px;border-radius:999px;font-size:15px}

/* QR pass */
.passzone{display:flex;flex-direction:column;gap:12px}
.pass{border-radius:34px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.p-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.p-row .tag{font-size:11px;letter-spacing:.18em;border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.p-amt{font-weight:300;font-size:clamp(46px,13.5vw,60px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.p-amt .rs{font-size:.66em;color:var(--warm);margin-right:4px;vertical-align:.1em}
.p-to{color:var(--soft);font-size:15px;margin-top:-4px;overflow-wrap:anywhere}.p-to b{color:#fff;font-weight:500}
.p-note{align-self:flex-start;font-size:12.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{align-self:center;background:#fff;border-radius:24px;padding:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);position:relative;overflow:hidden}
.qr{width:min(220px,58vw);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qr canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.tile.reveal .qr{animation:qrIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes qrIn{from{clip-path:inset(0 0 100% 0);opacity:.3}}
.p-vpa{text-align:center;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.p-apps{text-align:center;font-size:12px;color:var(--soft);margin-top:-6px}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.35);transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:20px;background:#fff}
.hint{font-size:12px;color:var(--soft);text-align:center;margin:-4px 0 0}

/* full screen + sheets */
.layer{z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.present{flex-direction:column;gap:18px;text-align:center;padding:calc(20px + max(env(safe-area-inset-top,0px),var(--sat,0px))) 20px calc(20px + max(env(safe-area-inset-bottom,0px),var(--sab,0px))) 20px;animation:fade .3s ease-out}
.present .ey{font-size:12px;letter-spacing:.26em;color:var(--soft);text-transform:uppercase}
.present .panel{border-radius:40px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.present .qr{width:min(270px,68vw)}
.present .who{font-size:17px}
.sheetwrap{align-items:flex-end;animation:fade .2s ease-out}
.sheet{width:100%;max-width:470px;border-radius:34px;margin-bottom:-34px;padding:12px 22px calc(56px + max(env(safe-area-inset-bottom,0px),var(--sab,0px))) 22px;display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.35);align-self:center}
.sheet h2{margin:0;font-weight:400;font-size:21px}
.f{display:flex;flex-direction:column;gap:7px}
.f input{font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:13px 15px;width:100%}
.f input::placeholder{color:rgba(255,255,255,.45)}
.f input:focus{border-color:rgba(255,255,255,.6);outline:none;background:rgba(255,255,255,.12)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bgs button{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
.bgs img,.bgs i{width:100%;aspect-ratio:3/5;border-radius:16px;display:block;background:#000;border:1px solid rgba(255,255,255,.18);object-fit:cover}
.bgs button[aria-pressed="true"]{color:#fff}
.bgs button[aria-pressed="true"] img,.bgs button[aria-pressed="true"] i{border-color:#fff;box-shadow:0 0 0 2px #fff}
.swatches button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(20,24,36,.6),0 0 0 5px #fff}
.tip{font-size:13px;color:var(--soft);margin:0}
.err{color:var(--warn);font-size:13.5px;min-height:1.2em;margin:0}
.row3{display:flex;gap:10px}.row3>*{flex:1}
.solid{height:50px;border-radius:999px;background:#fff;color:#1A1F2C;font-weight:500}
.preview img{width:100%;border-radius:20px;display:block}
.toast{position:fixed;left:50%;bottom:calc(28px + max(env(safe-area-inset-bottom,0px),var(--sab,0px)));transform:translate(-50%,10px);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;z-index:5;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:0;padding-bottom:0}body{margin:0}img{max-width:100%}</style>
</head>

  if(l<.5){const k=(.5-l)*1.4;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k)}return "#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}

/* ---------- spring presses ---------- */
class Spring{constructor(v,k,c){this.x=v;this.v=0;this.t=v;this.k=k;this.c=c;this.raf=0;this.on=null}

    const n=Math.ceil(dt/.004);dt/=n;for(let i=0;i<n;i++){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt}
    this.on&&this.on(this.x);Glass.mark();if(Math.abs(this.v)<.003&&Math.abs(this.x-this.t)<.0008){this.x=this.t;this.v=0;this.on&&this.on(this.x);this.raf=0;return}this.raf=requestAnimationFrame(tick)};this.raf=requestAnimationFrame(tick)}}}

function goTo(id,dir){if(id===state.active)return;const ids=state.accounts.map(a=>a.id);if(!dir)dir=ids.indexOf(id)>ids.indexOf(state.active)?1:-1;state.active=id;save();renderPass(dir)}

let enterV=0;
function attachSwipe(el){

  const paint=()=>{el.style.transform=`translateX(${xs.x.toFixed(2)}px) rotate(${(xs.x*.02).toFixed(3)}deg) scale(${(1+sq.x*.03).toFixed(4)},${(1-sq.x*.025).toFixed(4)})`};
  xs.on=paint;sq.on=paint;
  let id=null,x0=0,y0=0,horiz=null,hist=[];
  el.addEventListener("pointerdown",e=>{if(e.button)return;id=e.pointerId;x0=e.clientX-xs.x;y0=e.clientY;horiz=null;hist=[{t:e.timeStamp,x:e.clientX}]});
  el.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(horiz===null&&(Math.abs(mx)>8||Math.abs(my-0)>8)){horiz=Math.abs(mx)>Math.abs(e.clientY-y0);if(horiz)try{el.setPointerCapture(id)}catch(_){}}

    const a=hist[0],b=hist[hist.length-1],v=(b.x-a.x)/Math.max(1,b.t-a.t)*1000,w=el.offsetWidth;sq.to(0,{v:0});
    if(multi&&(Math.abs(xs.x)>w*.28||Math.abs(v)>700)){const dir=(Math.abs(v)>700?-Math.sign(v):-Math.sign(xs.x))||1,out=-dir*w*1.25;let fired=false;

  try{await Promise.race([Promise.all([document.fonts.load('300 150px "Onest"'),document.fonts.load('500 40px "Onest"'),document.fonts.load('500 34px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,1200))])}catch(e){}
  const W=1080,H=1600,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const F='"Onest",system-ui,sans-serif',M='"JetBrains Mono",ui-monospace,monospace';const ls=v=>{if("letterSpacing" in x)x.letterSpacing=v};
  let bgc=null;try{if(Glass.ok)bgc=Glass.sceneImage(540,800)}catch(e){}

  x.save();rr(x,cx,cy,cw,ch,R);x.clip();

function shareText(c){return `Payment request: ${fmt(c.n)} to ${c.a.name}${c.note?` for ${c.note}`:""}.\nScan the QR with any UPI app, or pay to UPI ID: ${c.a.vpa}`}
async function shareQR(){
  if(!current)return;const btn=$("shareBtn");btn.disabled=true;
  try{const cv=await buildCard(),url=cv.toDataURL("image/png"),text=shareText(current);
    if(IS_APP&&Android.shareImage){Android.shareImage(url.split(",")[1],text);return}
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));const file=blob&&new File([blob],"payment-qr.png",{type:"image/png"});
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text});return}catch(e){if(e&&e.name==="AbortError")return}}
    const bg=sheetShell(`<h2>Share this QR</h2><div class="preview"><img src="${url}" alt="Payment QR card"></div>
      <p class="tip">Press and hold the image to save or share it. Or copy the message and send it with the image.</p>
      <div class="row3"><button type="button" class="ghost" data-glass="pill" data-close>Close</button><button type="button" class="solid" id="pvCopy">Copy message</button></div>`);
    bg.querySelector("#pvCopy").onclick=()=>copyText(text,"Message copied");
  }catch(e){toast("Couldn't make the image. Try again.")}
  finally{btn.disabled=!current}
}
$("shareBtn").onclick=shareQR;

/* ---------- toast / copy ---------- */
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");Glass.burst(400);clearTimeout(toast.t);toast.t=setTimeout(()=>{e.classList.remove("on");Glass.burst(400)},1900)}
function copyText(text,msg){
  if(IS_APP&&Android.copy){try{Android.copy(text);return}catch(e){}}
  const fb=()=>{const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}t.remove();toast(ok?msg:"Couldn't copy. Select the text and copy it.")};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(fb)}catch(e){fb()}
}
$("copyBtn").onclick=()=>{const a=active();if(a)copyText(a.vpa,"UPI ID copied")};

/* ---------- back + keyboard ---------- */
window.__back=function(){
  const p=document.querySelector(".present");if(p){p._close();return 1}
  const s=document.querySelector(".sheetwrap");if(s){s._close();return 1}
  if(!$("vQR").hidden){backToPad();return 1}return 0};
document.addEventListener("keydown",e=>{
  if(document.querySelector(".sheetwrap")||/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName))return;
  if(e.key==="Escape"){window.__back();return}
  if(!$("vQR").hidden){if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);return}
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="."||e.key===",")press(".");else if(e.key==="Backspace")press("del");else if(e.key==="Enter")openQR()});

renderCards();renderAmt();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Glass.mark());
