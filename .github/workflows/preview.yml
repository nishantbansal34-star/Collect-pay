name: Preview APK

on:
  push:
    branches: ['liquid-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy web app into the APK (QR library bundled for offline use)
        run: |
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#' index.html > app/src/main/assets/index.html
          grep -q 'src="qrcode.min.js"' app/src/main/assets/index.html

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbePay-liquid-preview.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-liquid-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Orbe Pay liquid preview ${{ github.run_number }}
          body: Preview build of the liquid glass upgrade. Not the main release.
          files: OrbePay-liquid-preview.apk
          prerelease: true
          make_latest: false
